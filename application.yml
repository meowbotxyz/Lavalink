server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

  server:
    password: "meowbotxyz"
    sources:
      # Lavalink's built-in YouTube source is deprecated.
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false

    bufferDurationMs: 400
    playerUpdateInterval: 5

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # WEB is the primary client. ANDROID_MUSIC is a fallback.
    # TV supports OAuth, but should not be the first client.
    clients:
      - WEB
      - ANDROID_MUSIC
      - TV

    oauth:
      enabled: true
      # After completing OAuth once, paste the refresh token here if you
      # want to avoid repeating the device authorization flow.
      # refreshToken: "${YOUTUBE_REFRESH_TOKEN}"
      # skipInitialization: true

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
